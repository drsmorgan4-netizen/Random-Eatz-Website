<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Request Received | Random Eatz &amp; Catering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--yellow:#EFC406;--ink:#101010;--rust:#903B05;--paper:#FBF6EA}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Work Sans',sans-serif;background:var(--yellow);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;max-width:34rem;width:100%;text-align:center;padding:3rem 2rem}
.check{width:74px;height:74px;margin:0 auto 1.3rem;border-radius:50%;background:var(--ink);color:var(--yellow);font-size:2.2rem;line-height:74px;font-weight:700}
h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:2.2rem;letter-spacing:.01em;margin-bottom:.8rem}
p{font-size:1.08rem;line-height:1.55;color:#222;max-width:28rem;margin:0 auto .8rem}
.sub{font-size:.97rem;color:#444}
.sub a{color:var(--rust);font-weight:600;text-decoration:none}
.btn{display:inline-block;margin-top:1.6rem;background:var(--ink);color:var(--yellow);font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:.85rem 1.8rem;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Request Received!</h1>
    <p>Thanks &mdash; your catering request is in. We'll review your date and get back to you shortly with availability and a quote.</p>
    <p class="sub">Need an answer fast? Call or text <b>David or Seth</b> at <a href="tel:+15099038106">(509) 903-8106</a>.</p>
    <a class="btn" href="/">Back to Random Eatz</a>
  </div>
</body>
</html>
