<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>form detection</title></head>
<body>
<!-- This hidden file exists only so Netlify reliably detects the catering form. Visitors never see it. -->
<form name="catering" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="catering">
  <input name="bot-field">
  <input type="text" name="Name">
  <input type="tel" name="Phone">
  <input type="email" name="Email">
  <input type="date" name="Event Date">
  <input type="number" name="Headcount">
  <input type="text" name="Event Type">
  <textarea name="Location & Details"></textarea>
</form>
</body>
</html>
